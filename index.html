<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Fal-Astro/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fal Astro - Coffee fortune reading and personalized astrology app">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fal Astro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fal Astro</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "3097292262";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script>
  // Catch JavaScript errors
  window.onerror = function(message, source, lineno, colno, error) {
    console.error('🔴 JS Error:', message, 'at', source, lineno + ':' + colno);
    if (error && error.stack) console.error(error.stack);
    document.body.innerHTML =
      "<div style='padding:20px;font-family:system-ui,-apple-system,sans-serif;max-width:800px;margin:40px auto'>" +
      "<h2 style='color:#d32f2f'>⚠️ Uygulama Hatası</h2>" +
      "<pre style='background:#f5f5f5;padding:16px;border-radius:8px;overflow:auto;font-size:13px'>" +
      "Hata: " + message + "\n" +
      "Kaynak: " + source + "\n" +
      "Satır: " + lineno + ":" + colno + "\n\n" +
      (error && error.stack ? error.stack : "") +
      "</pre>" +
      "<p style='color:#666;font-size:14px'>Lütfen browser console'u (F12) kontrol edin.</p>" +
      "</div>";
    return true;
  };

  // Catch unhandled promise rejections
  window.addEventListener('unhandledrejection', function(event) {
    console.error('🔴 Unhandled Promise Rejection:', event.reason);
    document.body.innerHTML =
      "<div style='padding:20px;font-family:system-ui,-apple-system,sans-serif;max-width:800px;margin:40px auto'>" +
      "<h2 style='color:#d32f2f'>⚠️ Uygulama Hatası</h2>" +
      "<pre style='background:#f5f5f5;padding:16px;border-radius:8px;overflow:auto;font-size:13px'>" +
      "Promise Rejection: " + (event.reason || 'Unknown error') + "\n\n" +
      (event.reason && event.reason.stack ? event.reason.stack : "") +
      "</pre>" +
      "<p style='color:#666;font-size:14px'>Lütfen browser console'u (F12) kontrol edin.</p>" +
      "</div>";
  });
</script>
</body>
</html>
