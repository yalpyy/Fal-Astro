name: Deploy Flutter Web to GitHub Pages

on:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/gh-pages-flutter.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true

      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build web
        working-directory: flutter_app
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --base-href "/Fal-Astro/"

          # Base href'i kesinleştir (bazı durumlarda şaşabiliyor)
          sed -i 's|<base href="/"\s*/>|<base href="/Fal-Astro/"/>|g' build/web/index.html
          sed -i 's|<base href="/">|<base href="/Fal-Astro/">|g' build/web/index.html

          # GitHub Pages için iyi pratik
          touch build/web/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flutter_app/build/web
