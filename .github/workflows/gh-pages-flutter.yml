name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "flutter_app/**"
      - ".github/workflows/gh-pages-flutter.yml"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true

      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Verify secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL set? $([ -n "$SUPABASE_URL" ] && echo yes || echo no)"
          echo "SUPABASE_ANON_KEY set? $([ -n "$SUPABASE_ANON_KEY" ] && echo yes || echo no)"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Missing SUPABASE_URL or SUPABASE_ANON_KEY in GitHub Secrets."
            exit 1
          fi

      - name: Build web
        working-directory: flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --web-renderer html \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --base-href "/Fal-Astro/"

          # Base href'i kesinleştir
          sed -i 's|<base href="/"\s*/>|<base href="/Fal-Astro/"/>|g' build/web/index.html
          sed -i 's|<base href="/">|<base href="/Fal-Astro/">|g' build/web/index.html

          # GitHub Pages için iyi pratik
          touch build/web/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flutter_app/build/web
