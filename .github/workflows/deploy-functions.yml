name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to deploy (leave empty for all)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # Link to project
          supabase link --project-ref $SUPABASE_PROJECT_ID

          # Deploy specific function or all
          if [ -n "${{ github.event.inputs.function_name }}" ]; then
            echo "Deploying function: ${{ github.event.inputs.function_name }}"
            supabase functions deploy ${{ github.event.inputs.function_name }} --project-ref $SUPABASE_PROJECT_ID
          else
            echo "Deploying all functions..."

            # Deploy each function
            for dir in supabase/functions/*/; do
              if [ -d "$dir" ]; then
                func_name=$(basename "$dir")
                # Skip _shared folder
                if [ "$func_name" != "_shared" ]; then
                  echo "Deploying: $func_name"
                  supabase functions deploy "$func_name" --project-ref $SUPABASE_PROJECT_ID || echo "Failed to deploy $func_name"
                fi
              fi
            done
          fi

          echo "✅ Deployment complete!"
