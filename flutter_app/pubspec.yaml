name: fal_astro
description: Kahve falı ve kişiye özel astroloji uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.0

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Image Handling
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1

  # Storage & Cache
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # UI Components
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.3.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.3
  package_info_plus: ^5.0.1

  # Sign In
  sign_in_with_apple: ^5.0.0

  # In-App Purchase (stub)
  in_app_purchase: ^3.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
